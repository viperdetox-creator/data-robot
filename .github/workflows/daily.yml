# The data robot's workflow. Save it in your data-robot repository as
# .github/workflows/daily.yml. collect.py and pages.txt sit at the top of
# the repository, next to the .github folder.

# The name you see on the Actions tab.
name: Daily page views

on:
  # The schedule, in UTC: minute 17, hour 2, every day.
  # 02:17 UTC is 07:47 India time. Minute 17 avoids the busy start of the hour.
  schedule:
    - cron: '17 2 * * *'
  # Adds the "Run workflow" button, so you can also start it by hand.
  workflow_dispatch:

# The job may commit to this repository (it saves pageviews.csv).
permissions:
  contents: write

jobs:
  # One job, called collect, on a fresh Ubuntu computer that GitHub lends us.
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # stop a stuck run after 10 minutes
    steps:
      # Copy this repository (collect.py, pages.txt, pageviews.csv) onto the computer.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Install Python 3.12.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Run the robot. It adds the new days to pageviews.csv.
      - name: Collect page views
        run: python collect.py

      # Save pageviews.csv in the repository, but only when it changed.
      - name: Commit pageviews.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pageviews.csv
          if git diff --cached --quiet; then
            echo "pageviews.csv did not change: nothing to commit."
          else
            git commit -m "Add page views"
            git push
          fi
